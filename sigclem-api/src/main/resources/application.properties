spring.application.name=sigclem-api
server.port=8080

# Carga las credenciales locales de ../.env al ejecutar desde sigclem-api.
spring.config.import=optional:file:../.env[.properties]

# ---------- Base de datos (variables de entorno; ver .env.example) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/sigclem?serverTimezone=America/Mexico_City&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:sigclem_app}
spring.datasource.password=${DB_PASS:${DB_APP_PASS:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo administra Flyway (DA-05); Hibernate no crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# ---------- Flyway: usa una cuenta con permisos de DDL, distinta de la de la aplicación ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${FLYWAY_USER:sigclem_flyway}
spring.flyway.password=${FLYWAY_PASS:${DB_FLYWAY_PASS:}}

# ---------- Archivos (comprobantes, documentos, constancias) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.archivos.directorio=${ARCHIVOS_DIR:./archivos}

# ---------- Verificación automática de comprobantes (CFDI) ----------
# Estado del CFDI en el servicio público del SAT (el mismo del QR). Sin respuesta, queda «No disponible».
app.sat.habilitado=${SAT_CONSULTA:true}
app.sat.url=https://consultaqr.facturaelectronica.sat.gob.mx/ConsultaCFDIService.svc
app.sat.tiempo-maximo-segundos=10
# Los recibos del TecNM se emiten a público en general; se usa en la captura manual (sin QR).
app.cfdi.rfc-receptor=XAXX010101000
# OCR (Tesseract) para escaneos y fotos; vacío = sin OCR (los PDF digitales se cotejan sin él).
app.ocr.comando=${OCR_COMANDO:}
app.ocr.idioma=spa
app.ocr.tiempo-maximo-segundos=40

# ---------- Seguridad ----------
app.jwt.secreto=${JWT_SECRET:sigclem_jwt_clave_secreta_desarrollo_local_2026_itch_32_chars}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:28800000}
app.cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# Cuentas iniciales (solo se crean si no existe una cuenta con ese rol)
app.inicial.coordinador.usuario=${COORDINADOR_USUARIO:coordinador}
app.inicial.coordinador.contrasena=${COORDINADOR_CONTRASENA:Coordinador2026!}
app.inicial.jefa.usuario=${JEFA_USUARIO:jefa.dgtv}
app.inicial.jefa.contrasena=${JEFA_CONTRASENA:Jefa2026!}
# Cuenta de administrador (opcional): solo se crea si defines ambas variables. Sin valor por omisión a propósito.
app.inicial.admin.usuario=${ADMIN_USUARIO:}
app.inicial.admin.contrasena=${ADMIN_CONTRASENA:}

# ---------- MODO PRUEBAS (consumo de la API sin login) ----------
# true: si la petición no trae token JWT, se atiende como el usuario de la cabecera X-Usuario-Prueba
# o, si no se envía, como el usuario por omisión. Los roles y reglas de negocio se siguen validando.
# Desactivado por omisión: el sistema exige iniciar sesión. Solo se activa en un equipo de pruebas.
app.modo-pruebas.activo=${MODO_PRUEBAS:false}
app.modo-pruebas.usuario-por-omision=${MODO_PRUEBAS_USUARIO:${app.inicial.coordinador.usuario}}

# ---------- Errores y documentación de la API ----------
spring.mvc.problemdetails.enabled=true
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/docs/ui
springdoc.api-docs.enabled=${API_DOCS:false}
springdoc.swagger-ui.enabled=${API_DOCS:false}
# Ventana de endpoints: agrupados por módulo, con buscador, "Try it out" activo y la identidad recordada.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

logging.level.mx.edu.itch.sigclem=INFO
