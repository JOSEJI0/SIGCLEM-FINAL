server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de carga (comprobantes y documentos de hasta 5 MB)
    client_max_body_size 6m;

    # Compresión de la interfaz (JavaScript, CSS, JSON y SVG).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad (Tabla 79, A05)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8080/api/;
        # $http_host conserva el puerto (las redirecciones de Swagger UI funcionan con WEB_PORT distinto de 80)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La carga de un comprobante puede incluir OCR y la consulta al SAT.
        proxy_read_timeout 120s;
    }

    # Worker de pdf.js (visor de documentos): módulo .mjs que debe servirse como JavaScript.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html sin caché: tras una actualización, los usuarios reciben la versión nueva.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Rutas de la SPA (React Router)
    location / {
        try_files $uri /index.html;
    }
}
